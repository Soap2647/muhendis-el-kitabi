name: telemetri

services:
  api:
    build: ./api
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_VERSION: "1.2.0"
      PORT: "8080"
      DB_HOST: db
    expose: ["8080"]
    depends_on:
      db:
        condition: service_healthy
    networks: [ic]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: telemetri
      POSTGRES_USER: telemetri
      POSTGRES_PASSWORD_FILE: /run/secrets/db_parola
    secrets: [db_parola]
    volumes:
      - veri:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetri -d telemetri"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ic]

  proxy:
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [ic, dis]

volumes:
  veri:

networks:
  ic:
    internal: true
  dis: {}

secrets:
  db_parola:
    file: ./secrets/db_parola.txt
